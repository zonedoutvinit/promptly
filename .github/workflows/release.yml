name: Release

on:
  push:
    tags:
      - "v*" # This triggers the build only when you create a tag like "v1.0.0"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Define exact combinations of OS, friendly names, and builder arguments
        include:
          - os: windows-latest
            name: Windows
            args: --win
            channel: latest
          - os: macos-latest
            name: macOS
            args: --mac
            channel: latest
          - os: ubuntu-latest
            name: Linux-Deb
            args: --linux deb
            channel: deb
          - os: ubuntu-latest
            name: Linux-RPM
            args: --linux rpm
            channel: rpm
          - os: ubuntu-latest
            name: Linux-Pacman
            args: --linux pacman
            channel: pacman

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Source
        run: npm run build

      # Pass the matrix channel to electron-builder so it names the .yml files correctly
      - name: Package Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- ${{ matrix.args }} -c.publish.provider=github -c.publish.channel=${{ matrix.channel }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.*
            dist/*.yml
