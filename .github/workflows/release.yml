name: Release

on:
  push:
    tags:
      - "v*" # Triggers the build when you create a tag like "v1.1.1"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Essential: allows the action to write to your release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux-AppImage
            args: --linux AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Source
        run: npm run build

      # Package the binaries
      # --publish prevents electron-builder from uploading immediately,
      # but it WILL generate correct latest.yml, latest-mac.yml, and latest-linux.yml configurations.
      - name: Package Release
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Upload to GitHub Release
      # Upstream updater blockmaps (.blockmap) are preserved to secure delta-updates for Win/Linux.
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
