name: Release

on:
  push:
    tags:
      - "v*" # This triggers the build only when you create a tag like "v1.0.0"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Define exact combinations of OS, friendly names, and builder arguments
        include:
          - os: windows-latest
            name: Windows
            args: --win
            channel: latest
          - os: macos-latest
            name: macOS
            args: --mac
            channel: latest
          - os: ubuntu-latest
            name: Linux-Deb
            args: --linux deb
            channel: deb
          - os: ubuntu-latest
            name: Linux-RPM
            args: --linux rpm
            channel: rpm
          - os: ubuntu-latest
            name: Linux-Pacman
            args: --linux pacman
            channel: pacman

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Source
        run: npm run build

      - name: Package Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always --config.publish.channel=${{ matrix.channel }}

      - name: Create Metadata Manually
        if: runner.os == 'Linux'
        run: |
          # 1. Identify the installer file we just built
          FILE=$(ls dist/*.${{ matrix.channel }} 2>/dev/null | head -n 1)

          # 2. Extract the filename and calculate sha512 (required for electron-updater)
          FILENAME=$(basename "$FILE")
          SHA=$(sha512sum "$FILE" | cut -d ' ' -f 1)

          # 3. Create the YAML file that electron-updater expects
          cat <<EOF > dist/${{ matrix.channel }}-linux.yml
          version: ${{ github.ref_name }}
          path: $FILENAME
          sha512: $SHA
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          EOF

          echo "Created dist/${{ matrix.channel }}-linux.yml for $FILENAME"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.*
            dist/*-linux.yml
