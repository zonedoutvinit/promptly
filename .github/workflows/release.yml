name: Release

on:
  push:
    tags:
      - "v*" # Triggers the build when you create a tag like "v1.1.1"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Essential: allows the action to write to your release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
            channel: latest
          - os: macos-latest
            name: macOS
            args: --mac
            channel: latest
          - os: ubuntu-latest
            name: Linux-Deb
            args: --linux deb
            channel: deb
          - os: ubuntu-latest
            name: Linux-RPM
            args: --linux rpm
            channel: rpm
          - os: ubuntu-latest
            name: Linux-Pacman
            args: --linux pacman
            channel: pacman

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Source
        run: npm run build

      # 1. Package the binaries
      # --publish prevents electron-builder from uploading, but because "publish"
      # is set to "github" in package.json, it WILL generate latest.yml/latest-mac.yml
      # with the correct github.com/zonedoutvinit/promptly download URLs.
      - name: Package Release
        run: npx electron-builder ${{ matrix.args }} --publish never

      # 2. Create the missing Metadata YAML (Only for Linux)
      # Kept specifically because electron-builder does not generate pacman-linux.yml
      - name: Create Metadata Manually
        if: runner.os == 'Linux'
        run: |
          FILE=$(ls dist/*.${{ matrix.channel }} 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then exit 1; fi
          FILENAME=$(basename "$FILE")
          SHA=$(sha512sum "$FILE" | cut -d ' ' -f 1)
          cat <<EOF > dist/${{ matrix.channel }}-linux.yml
          version: ${{ github.ref_name }}
          files:
            - url: $FILENAME
              sha512: $SHA
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          EOF

      # 3. Upload to Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.*
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
            dist/*-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
