name: Release

on:
  push:
    tags:
      - "v*" # Triggers the build when you create a tag like "v1.1.1"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Essential: allows the action to write to your release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
            channel: latest
          - os: macos-latest
            name: macOS
            args: --mac
            channel: latest
          - os: ubuntu-latest
            name: Linux-Deb
            args: --linux deb
            channel: deb
          - os: ubuntu-latest
            name: Linux-RPM
            args: --linux rpm
            channel: rpm
          - os: ubuntu-latest
            name: Linux-Pacman
            args: --linux pacman
            channel: pacman

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Source
        run: npm run build

      # 1. Package and Upload Binaries to Release
      # electron-builder --publish always does the heavy lifting for the binary files
      - name: Package Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always --config.publish.channel=${{ matrix.channel }}

      # 2. Create the missing Metadata YAML
      # This creates the file electron-builder skipped for beta Linux targets
      - name: Create Metadata Manually
        if: runner.os == 'Linux'
        run: |
          FILE=$(ls dist/*.${{ matrix.channel }} 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then exit 1; fi

          FILENAME=$(basename "$FILE")
          SHA=$(sha512sum "$FILE" | cut -d ' ' -f 1)

          cat <<EOF > dist/${{ matrix.channel }}-linux.yml
          version: ${{ github.ref_name }}
          path: $FILENAME
          sha512: $SHA
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          EOF

      # 3. Upload to Actions Tab (for your own inspection)
      - name: Upload Artifacts (Internal Debugging)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*-linux.yml

      # 4. Attach Metadata to Public Release Page
      # This only uploads the .yml files. The binaries are already there.
      - name: Append Metadata to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
